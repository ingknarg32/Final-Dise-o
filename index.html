<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1530">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1530'/%3E%3Crect x='18' y='18' width='28' height='28' rx='3' fill='none' stroke='%237dd3fc' stroke-width='4'/%3E%3Crect x='27' y='27' width='10' height='10' fill='%237dd3fc'/%3E%3C/svg%3E">
  <title>PC-Builder AR</title>
  <meta name="description" content="Aplicación web de realidad aumentada (AR.js + A-Frame + Tailwind CSS) para aprender Arquitectura de Computadores.">

  <!-- Librerías locales (versiones fijadas): A-Frame 1.3.0 · AR.js 3.4.5 · Tailwind 3.4.1 -->
  <script src="lib/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { navy: { 950: '#070e22', 900: '#0b1530', 800: '#111d3d', 700: '#1a2a55' } },
        fontFamily: { sans: ['"Segoe UI"', 'system-ui', '-apple-system', 'Roboto', 'sans-serif'] }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/aframe.min.js"></script>
  <script src="lib/aframe-ar.js"></script>
  <script src="js/models.js" defer></script>
  <script src="js/app.js" defer></script>
</head>

<body class="bg-navy-900 text-slate-100 font-sans antialiased">

  <!-- ============ PANTALLA 1 · MENÚ (lista de componentes) ============ -->
  <main id="screen-menu" class="screen min-h-full flex flex-col" data-screen="menu">
    <header class="px-5 pt-[max(1.5rem,env(safe-area-inset-top))] pb-4 max-w-4xl w-full mx-auto">
      <div class="flex items-start justify-between gap-3">
        <p class="text-xs font-semibold tracking-[.18em] text-sky-300 uppercase" data-i18n="kicker"></p>
        <div class="flex rounded-full border border-slate-600 overflow-hidden text-xs" role="group" aria-label="Language / Idioma">
          <button type="button" data-lang="es" class="lang-btn px-3 min-h-[44px] min-w-[48px]">ES</button>
          <button type="button" data-lang="en" class="lang-btn px-3 min-h-[44px] min-w-[48px]">EN</button>
        </div>
      </div>
      <h1 id="menu-title" tabindex="-1" class="mt-1 text-4xl sm:text-5xl font-bold text-white">PC-Builder AR</h1>
      <p class="mt-2 text-slate-300 max-w-xl" data-i18n="tagline"></p>
      <ul class="mt-4 flex flex-wrap gap-2 text-xs" aria-label="Stack">
        <li class="chip">AR.js</li><li class="chip">A-Frame</li><li class="chip">Tailwind CSS</li><li class="chip">Mobile Web</li>
      </ul>
    </header>

    <section class="px-5 pb-6 max-w-4xl w-full mx-auto flex-1" aria-labelledby="pick-title">
      <div class="flex items-baseline justify-between mb-3">
        <h2 id="pick-title" class="text-lg font-semibold text-white" data-i18n="pick"></h2>
        <p class="text-xs text-slate-400" data-i18n="available"></p>
      </div>
      <div id="menu-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </section>

    <footer class="px-5 pb-[max(1.5rem,env(safe-area-inset-bottom))] max-w-4xl w-full mx-auto">
      <div class="rounded-2xl bg-navy-800 border border-navy-700 p-4 flex gap-4 items-center">
        <img src="assets/hiro.png" alt="Marcador Hiro" width="72" height="72" class="rounded-lg bg-white p-1 shrink-0">
        <div class="text-sm text-slate-300">
          <p class="font-semibold text-white" data-i18n="markerTitle"></p>
          <p class="mt-1" data-i18n="markerText"></p>
          <a href="assets/hiro.png" target="_blank" rel="noopener" class="inline-block mt-2 text-sky-300 underline underline-offset-2" data-i18n="markerOpen"></a>
        </div>
      </div>
    </footer>
  </main>

  <!-- ============ PANTALLA 2 · COMPONENTE SELECCIONADO ============ -->
  <section id="screen-select" class="screen hidden min-h-full flex-col" data-screen="select" aria-live="polite">
    <div class="px-5 pt-[max(1rem,env(safe-area-inset-top))] pb-6 max-w-2xl w-full mx-auto flex flex-col flex-1">
      <button type="button" id="select-back" class="btn-ghost self-start -ml-2">
        <span aria-hidden="true">←</span> <span data-i18n="back"></span>
      </button>

      <div class="mt-3 flex items-center gap-4">
        <div id="select-icon" class="shrink-0 w-24 h-24 rounded-2xl bg-navy-800 border border-navy-700 grid place-items-center text-sky-300"></div>
        <div>
          <p class="text-xs font-semibold tracking-[.18em] text-sky-300 uppercase" id="select-full"></p>
          <h2 id="select-title" tabindex="-1" class="text-4xl font-bold text-white"></h2>
        </div>
      </div>

      <div class="mt-5 rounded-2xl bg-navy-800 border border-navy-700 p-4">
        <p class="text-xs font-semibold uppercase tracking-wider text-sky-300" data-i18n="conceptLabel"></p>
        <p id="select-concept" class="mt-1 text-white font-medium"></p>
        <p id="select-desc" class="mt-3 text-slate-300"></p>
        <ul id="select-facts" class="mt-3 space-y-1.5 text-sm text-slate-300 list-disc pl-5 marker:text-sky-400"></ul>
      </div>

      <div class="mt-auto pt-6 space-y-3">
        <p class="text-xs text-slate-400" data-i18n="cameraWhy"></p>
        <button type="button" id="btn-start-ar" class="btn-primary w-full" data-i18n="startAR"></button>
        <button type="button" id="btn-start-preview" class="btn-secondary w-full" data-i18n="preview"></button>
        <p id="select-error" role="alert" class="hidden text-sm text-amber-300 bg-amber-950/60 border border-amber-700 rounded-xl p-3"></p>
      </div>
    </div>
  </section>

  <!-- ============ PANTALLA 3 · VISTA AR (solo controles esenciales) ============ -->
  <section id="screen-ar" class="screen hidden fixed inset-0 z-50 pointer-events-none" data-screen="ar">
    <!-- barra superior -->
    <div class="absolute top-0 inset-x-0 p-3 pt-[max(.75rem,env(safe-area-inset-top))] flex items-center justify-between gap-2">
      <p id="status-pill" role="status" class="pointer-events-auto pill">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <span id="status-text"></span>
      </p>
      <button type="button" id="ar-menu" class="pointer-events-auto btn-glass">
        <span aria-hidden="true">☰</span> <span data-i18n="back"></span>
      </button>
    </div>

    <!-- cargando cámara -->
    <div id="ar-loader" class="absolute inset-0 grid place-items-center bg-navy-900/80">
      <p class="flex items-center gap-3 text-white"><span class="spinner" aria-hidden="true"></span><span data-i18n="loading"></span></p>
    </div>

    <!-- ayuda de vista previa -->
    <p id="preview-hint" class="hidden absolute top-16 inset-x-0 text-center text-xs text-slate-300 drop-shadow" data-i18n="previewHint"></p>

    <!-- tarjeta inferior -->
    <div class="absolute bottom-0 inset-x-0 p-3 pb-[max(.75rem,env(safe-area-inset-bottom))] md:inset-x-auto md:right-4 md:bottom-4 md:w-96">
      <div class="pointer-events-auto rounded-2xl bg-navy-900/90 backdrop-blur border border-navy-700 shadow-2xl">
        <div class="p-4 pb-3">
          <p id="ar-full" class="text-[11px] font-semibold uppercase tracking-[.16em] text-sky-300"></p>
          <h2 id="ar-title" class="text-xl font-bold text-white"></h2>
          <p id="ar-concept" class="mt-1 text-sm text-slate-300"></p>
        </div>
        <div id="ar-parts" class="hidden px-4 pb-3 max-h-[28vh] overflow-y-auto border-t border-navy-700 pt-3">
          <ul id="ar-parts-list" class="space-y-2 text-sm"></ul>
        </div>
        <div class="grid grid-cols-2 gap-2 p-3 pt-0">
          <button type="button" id="btn-rotate" class="btn-toggle" aria-pressed="true" data-i18n="rotate"></button>
          <button type="button" id="btn-details" class="btn-toggle" aria-pressed="false" data-i18n="details"></button>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
